<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Blazing Chess Academy architecture</title>
<desc id="desc">A visitor's browser loads Next.js 14 App Router pages (/, /programs, /coaches, /contact) hosted on Vercel. Components read content from lib/constants.ts. The contact form posts to the /api/contact route handler, which checks the fields and forwards the inquiry to the Telegram Bot API, which delivers it to the academy chat. A registration modal exists with a mocked submit and is not mounted on any page.</desc>
